# Сборка debug APK приложения FuckBot RC в облаке GitHub.
#
# Ничего устанавливать не нужно: запушьте изменения (или нажмите "Run workflow"
# на вкладке Actions) — через несколько минут APK появится в артефактах сборки.
#
#   Actions → "APK" → последний запуск → Artifacts → FuckBotRC-apk.zip
#
# Если запушить тег вида v1.0, APK дополнительно прикрепится к GitHub Release,
# откуда его можно скачать прямо на телефон и установить.

name: APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Компоненты SDK (platform 34, build-tools 34)
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FuckBotRC.apk

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: FuckBotRC-apk
          path: FuckBotRC.apk
          if-no-files-found: error

      - name: Приложить к релизу (только при пуше тега v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FuckBotRC.apk
          generate_release_notes: true
